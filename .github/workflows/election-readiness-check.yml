name: Election Readiness Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/election-readiness.json
      - data/election-config.json
      - data/general-source-readiness.json
      - data/manifest.json
      - data/statewide.json
      - data/florida-counties.geojson
      - data/florida-counties.README.md
      - data/voter-registration-by-county.json
      - data/precinct-map-readiness.json
      - data/district-9.json
      - index.html
      - scripts/build_general_source_inventory.py
      - scripts/check_election_readiness.py
      - scripts/validate_florida_heatmap.py
      - scripts/validate_precinct_map_readiness.py
      - scripts/test_build_general_source_inventory.py
      - .github/workflows/election-readiness-check.yml
  pull_request:
    paths:
      - data/election-readiness.json
      - data/election-config.json
      - data/general-source-readiness.json
      - data/manifest.json
      - data/statewide.json
      - data/florida-counties.geojson
      - data/florida-counties.README.md
      - data/voter-registration-by-county.json
      - data/precinct-map-readiness.json
      - data/district-9.json
      - index.html
      - scripts/build_general_source_inventory.py
      - scripts/check_election_readiness.py
      - scripts/validate_florida_heatmap.py
      - scripts/validate_precinct_map_readiness.py
      - scripts/test_build_general_source_inventory.py
      - .github/workflows/election-readiness-check.yml

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test General source inventory
        run: python scripts/test_build_general_source_inventory.py -v
      - name: Validate Florida heat map
        run: python scripts/validate_florida_heatmap.py
      - name: Validate precinct map readiness
        run: python scripts/validate_precinct_map_readiness.py
      - name: Check election readiness
        run: python scripts/check_election_readiness.py
