name: General Election source verification
on:
  pull_request:
    paths: ['scripts/collect_general_watch.py', '.github/workflows/general-watch.yml', '.github/workflows/general-source-probe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official General Election sources
        run: |
          mkdir -p /tmp/general-source-evidence
          python3 - <<'PY'
          import urllib.request, re, pathlib
          urls=['https://floridaelectionwatch.gov/Downloads','https://floridaelectionwatch.gov/TrackCounty/IND','https://www.voteindianriver.gov/']
          for i,url in enumerate(urls):
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'IRC-Media-Election-Center/1.0'}),timeout=30)
              text=r.read().decode('utf-8','replace')
              pathlib.Path('/tmp/general-source-evidence/'+str(i)+'.html').write_text(text)
              print('SOURCE',url,r.status,'FINAL',r.url,'BYTES',len(text))
              for href,body in re.findall(r'<a[^>]+href=["\x27]([^"\x27]+)["\x27][^>]*>(.*?)</a>',text,re.S):
                label=re.sub('<[^>]*>',' ',body).strip()
                if any(w in (label+' '+href).lower() for w in ['results','vote','file','download','general','election']):
                  print(label[:100],href)
              print('PAGE TEXT',re.sub('<[^>]*>',' ',text)[-12000:])
            except Exception as e: print('SOURCE ERROR',url,str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-source-evidence
          path: /tmp/general-source-evidence
