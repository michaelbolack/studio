name: Promote Okaloosa v2
on:
  push:
    branches: [promote-okaloosa-v2]
    paths:
      - 'scripts/promote_okaloosa_v2.py'
      - '.github/workflows/promote-okaloosa-v2.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin county-recovery-v2
      - run: python scripts/promote_okaloosa_v2.py
      - name: Validate focused output
        run: |
          python - <<'PY'
          import json
          f=json.load(open('data/okaloosa.json'))
          assert f['coverageComplete'] is True
          assert f['precinctsReporting']==52 and f['precinctsTotal']==52
          assert len(f['races'])==11
          assert len(f['validation']['statewideOverlapChecks'])==8
          m=json.load(open('data/manifest.json'))['counties']['Okaloosa']
          assert m['connected'] is True and m['races']==11
          PY
      - name: Persist focused promotion
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/okaloosa.json data/manifest.json
          git commit -m 'Prepare validated Okaloosa v2 promotion'
          git push origin HEAD:promote-okaloosa-v2
