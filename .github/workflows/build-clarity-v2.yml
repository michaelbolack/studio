name: Build Clarity v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/clarity_json_recovery.py'
      - 'scripts/probe_clarity_browser_v2.py'
      - '.github/workflows/build-clarity-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 clarify selenium
      - name: Probe official Clarity pages in browser
        run: python scripts/probe_clarity_browser_v2.py
      - name: Persist browser discovery
        if: always()
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add clarity-browser-probe.json || true
          git diff --cached --quiet || git commit -m 'Capture Clarity browser discovery'
          git pull --rebase origin county-recovery-v2 || true
          git push || true
