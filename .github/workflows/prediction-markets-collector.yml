name: Prediction Markets Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * *'
  push:
    branches: [main]
    paths:
      - scripts/collect_prediction_markets.py
      - scripts/validate_prediction_markets.py
      - scripts/validate_prediction_markets_collector.py
      - .github/workflows/prediction-markets-collector.yml
  pull_request:
    paths:
      - data/prediction-markets-readiness.json
      - scripts/collect_prediction_markets.py
      - scripts/validate_prediction_markets.py
      - scripts/validate_prediction_markets_collector.py
      - .github/workflows/prediction-markets-collector.yml

permissions:
  contents: write

concurrency:
  group: prediction-markets-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current Kalshi markets
        run: python scripts/collect_prediction_markets.py
      - name: Validate collected snapshot
        run: python scripts/validate_prediction_markets.py
      - name: Validate collector isolation
        run: python scripts/validate_prediction_markets_collector.py
      - name: Publish prediction-market snapshot only
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/prediction-markets.json; then
            echo "No prediction-market snapshot change."
            exit 0
          fi
          git config user.name "ircmedia-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prediction-markets.json
          git commit -m "Update prediction-market snapshot"
          git push
