name: Probe Broward Aggregate v2
on:
  workflow_dispatch:
  push:
    branches: [rebuild/election-ingestion-v2]
    paths:
      - 'scripts/probe_broward_precinct_aggregate_v2.py'
      - '.github/workflows/probe-broward-aggregate-v2.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/probe_broward_precinct_aggregate_v2.py
      - name: Persist proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation-output/broward-precinct-aggregate-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store Broward precinct aggregation proof v2 [skip ci]'
          git push origin HEAD:rebuild/election-ingestion-v2
