name: General Election Watch
on:
  workflow_dispatch:
  pull_request:
    paths: ['assets/general-watch.mjs', 'scripts/collect_general_watch.py', 'tests/general-watch.test.mjs', 'tests/test_general_watch.py', 'tests/fixtures/**', 'data/general-watch*', '.github/workflows/general-watch.yml', 'index.html']
  push:
    branches: [main]
    paths: ['assets/general-watch.mjs', 'scripts/collect_general_watch.py', 'data/general-watch-contract.json', '.github/workflows/general-watch.yml', 'index.html']
  schedule:
    - cron: '*/5 12-23 3 11 *'
    - cron: '*/5 * 4 11 *'
    - cron: '17 * 5-17 11 *'
permissions:
  contents: read
concurrency:
  group: general-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - id: window
        run: |
          python3 - <<'PYTIME' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          active=datetime(2026,11,2,tzinfo=timezone.utc)<=now<datetime(2026,11,18,tzinfo=timezone.utc)
          print("active="+str(active).lower())
          PYTIME
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source identity, delayed updates, pending and live states
        run: |
          python3 -m unittest tests/test_general_watch.py -v
          node --test tests/general-watch.test.mjs tests/election-navigation.test.mjs tests/election-voter-hub.test.mjs
      - name: Real official-source collection dry run
        if: github.event_name == 'pull_request'
        run: python3 scripts/collect_general_watch.py --output collector-staging/general-watch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-watch-dry-run
          path: collector-staging/general-watch*.json
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.active == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect official General returns; retain last valid source on failure
        id: collect
        continue-on-error: true
        run: python3 scripts/collect_general_watch.py
      - name: Commit only independent General watch snapshots and health
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/general-watch.json data/general-watch-state.json data/general-watch-county.json data/general-watch-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official General Election watch snapshot"
            git push origin HEAD:main
          fi
      - name: Package existing static site with updated results
        run: |
          mkdir -p /tmp/general-watch-site
          cp index.html newsroom.html results.json /tmp/general-watch-site/
          cp -a assets data /tmp/general-watch-site/
          touch /tmp/general-watch-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/general-watch-site
      - name: Deploy refreshed results to the existing GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report a source outage after publishing its delay status
        if: steps.collect.outcome == 'failure'
        run: exit 1
