name: Apply Election Center UX migration

on:
  push:
    branches: [fix/protect-v2-data]
    paths:
      - 'scripts/apply_election_center_ux.py'
      - '.github/workflows/apply-election-center-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/apply_election_center_ux.py
      - name: Validate no default county and incumbent UI
        run: |
          grep -q "let currentCounty=null" index.html
          grep -q "Select your county" index.html
          grep -q "INCUMBENT" index.html
          ! grep -q "let currentCounty='Indian River'" index.html
      - name: Commit migrated frontend
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No frontend changes"
          else
            git commit -m "Prompt visitors to select county and support incumbent badges"
            git push origin HEAD:fix/protect-v2-data
          fi
