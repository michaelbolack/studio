name: Finalize Osceola Uploaded Snapshot
on:
  push:
    branches: [main]
    paths:
      - data/osceola.json
      - scripts/validate_osceola_final.py
      - .github/workflows/finalize-osceola-uploaded.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Osceola against protected Florida data
        run: python scripts/validate_osceola_final.py
      - name: Commit validated outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/osceola.json data/manifest.json osceola-final-validation.json
          git commit -m "validate Osceola final county coverage" || exit 0
          git push origin HEAD:main
