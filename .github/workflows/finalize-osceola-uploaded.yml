name: Finalize Osceola Uploaded Snapshot
on:
  workflow_dispatch:
  push:
    branches: [fix/osceola-final-coverage]
    paths:
      - scripts/finalize_osceola_uploaded.py
      - .github/workflows/finalize-osceola-uploaded.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/osceola-final-coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate Osceola
        run: python scripts/finalize_osceola_uploaded.py
      - name: Commit validated outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/osceola.json data/manifest.json osceola-final-validation.json
          git commit -m "validate Osceola final county coverage" || exit 0
          git push origin HEAD:fix/osceola-final-coverage
