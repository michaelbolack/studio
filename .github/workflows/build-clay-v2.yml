name: Build Clay v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/build_clay_v2.py'
      - '.github/workflows/build-clay-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/build_clay_v2.py
      - name: Persist only validated Clay output
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/clay.json data/manifest.json clay-v2-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build validated Clay v2 county feed'
          git push
# retrigger validation
