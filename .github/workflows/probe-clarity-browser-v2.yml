name: Probe Clarity browser v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/probe_clarity_browser_v2.py'
      - '.github/workflows/probe-clarity-browser-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - name: Run isolated browser probe
        run: python scripts/probe_clarity_browser_v2.py
      - name: Persist probe output
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add clarity-browser-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist Clarity browser probe'
          git pull --rebase origin county-recovery-v2
          git push origin HEAD:county-recovery-v2
