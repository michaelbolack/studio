name: Update election results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_counties.py'
      - '.github/workflows/update-election-results.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Pull latest county and statewide results
        run: python scripts/update_counties.py
      - name: Publish updated result files
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update live election results"
            git push
          fi
