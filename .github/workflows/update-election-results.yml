name: Recover election result feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_counties.py'
      - 'scripts/fix_enr_summary.py'
      - 'scripts/enr_asset_recovery.py'
      - 'scripts/vendor_adapters.py'
      - 'scripts/clarity_json_recovery.py'
      - 'scripts/vendor_asset_probe.py'
      - 'scripts/validate_vendor_output.py'
      - 'scripts/repair_invalid_counties.py'
      - 'scripts/final_integrity_gate.py'
      - 'scripts/normalize_results.py'
      - 'scripts/official_state_results.py'
      - 'scripts/suppress_incomplete_aggregates.py'
      - 'scripts/protect_v2_data.py'
      - '.github/workflows/update-election-results.yml'

concurrency:
  group: election-results-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 clarify
      - name: Pull latest county and statewide results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 8m python scripts/update_counties.py
      - name: Recover Florida ENR counties from summary pages
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/fix_enr_summary.py || echo "ENR summary recovery timed out/failed; continuing to integrity checks"
      - name: Discover official data endpoints for unresolved Florida ENR counties
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/enr_asset_recovery.py || echo "ENR endpoint recovery timed out/failed; continuing"
      - name: Sanity-check ENR endpoint recoveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vendor_output.py
      - name: Retry live ENR summaries after stale zero-vote feeds are quarantined
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 2m python scripts/fix_enr_summary.py || echo "ENR summary retry timed out/failed; continuing"
      - name: Retry ENR endpoint discovery after quarantine
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 2m python scripts/enr_asset_recovery.py || echo "ENR endpoint retry timed out/failed; continuing"
      - name: Revalidate ENR quarantine recoveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vendor_output.py
      - name: Recover disconnected vendor-specific county feeds
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/vendor_adapters.py || echo "Vendor recovery timed out/failed; continuing"
      - name: Sanity-check initial vendor recoveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vendor_output.py
      - name: Recover Clarity counties from official JSON/XML endpoints
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/clarity_json_recovery.py || echo "Clarity recovery timed out/failed; continuing"
      - name: Sanity-check Clarity recoveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vendor_output.py
      - name: Discover data endpoints for quarantined JS vendor apps
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/vendor_asset_probe.py || echo "Vendor asset discovery timed out/failed; continuing"
      - name: Sanity-check endpoint recoveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vendor_output.py
      - name: Validate and repair suspicious county feeds
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/repair_invalid_counties.py || echo "Repair pass timed out/failed; final integrity gate will quarantine unresolved feeds"
      - name: Final integrity gate before aggregation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/final_integrity_gate.py
      - name: Normalize candidate names and rebuild aggregates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/normalize_results.py
      - name: Prefer Florida DOS compiled statewide and District 9 totals
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: timeout 3m python scripts/official_state_results.py || echo "Florida DOS compiled feed unavailable; keeping validated county-derived aggregates"
      - name: Withhold incomplete statewide and district totals
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/suppress_incomplete_aggregates.py
      - name: Verify required election files exist
        run: |
          test -s data/manifest.json
          test -s data/indian-river.json
          test -s data/statewide.json
          test -s data/district-9.json
      - name: Publish updated result files safely without overwriting v2-owned data
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/election-data
          cp -a data /tmp/election-data
          git fetch origin main
          python scripts/protect_v2_data.py --generated-dir /tmp/election-data --live-ref origin/main
          git reset --hard origin/main
          rm -rf data
          cp -a /tmp/election-data data
          git add data/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update live election results"
            git push origin HEAD:main
          fi
