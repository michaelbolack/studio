name: Build Seminole v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/build_seminole_v2.py'
      - '.github/workflows/build-seminole-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/build_seminole_v2.py
      - name: Persist only validated Seminole output
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seminole.json data/manifest.json seminole-v2-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Build validated Seminole v2 county feed"
            git pull --rebase origin county-recovery-v2
            git push origin HEAD:county-recovery-v2
          fi
