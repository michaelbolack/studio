name: Promote Broward v2
on:
  workflow_dispatch:
  push:
    branches: [promote/broward-v2]
    paths:
      - '.github/workflows/promote-broward-v2.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/broward-v2
          fetch-depth: 0
      - name: Fetch verified rebuild snapshot
        run: git fetch origin rebuild/election-ingestion-v2
      - name: Install verified Broward data and patch manifest
        run: |
          git show origin/rebuild/election-ingestion-v2:validation-output/broward-v2.json > data/broward.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/manifest.json')
          m=json.loads(p.read_text())
          b=json.loads(Path('data/broward.json').read_text())
          m.setdefault('counties',{})['Broward']={
            'connected':True,'file':'data/broward.json','sourceUrl':b['sourceUrl'],'races':len(b['races']),
            'adapter':'broward-precinct-aggregate-v2',
            'validation':{'coverageComplete':b['coverageComplete'],'precinctsReporting':b['precinctsReporting'],'precinctsTotal':b['precinctsTotal'],'statewideOverlapChecks':len(b['validation']['statewideOverlapChecks'])}
          }
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Validate promotion payload
        run: |
          python - <<'PY'
          import json
          b=json.load(open('data/broward.json'));m=json.load(open('data/manifest.json'));e=m['counties']['Broward']
          assert b['coverageComplete'] is True and b['precinctsReporting']==b['precinctsTotal']==346 and len(b['races'])==28
          assert e['connected'] is True and e['file']=='data/broward.json'
          print('PASS: focused Broward production payload')
          PY
      - name: Commit focused promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/broward.json data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Promote verified Broward v2 county feed'
          git push origin HEAD:promote/broward-v2
# trigger
