name: Update final three fallback links
on:
  push:
    branches: [fix-final-three-fallback-links]
    paths:
      - 'scripts/update_final_three_fallbacks.py'
      - '.github/workflows/update-final-three-fallbacks.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_final_three_fallbacks.py
      - name: Persist manifest update
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/manifest.json
          git commit -m 'Update final three official fallback destinations'
          git push origin HEAD:fix-final-three-fallback-links
