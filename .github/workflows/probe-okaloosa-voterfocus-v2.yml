name: Probe Okaloosa VoterFocus v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/probe_okaloosa_voterfocus_v2.py'
      - '.github/workflows/probe-okaloosa-voterfocus-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_okaloosa_voterfocus_v2.py
      - name: Persist probe
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add okaloosa-voterfocus-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Okaloosa VoterFocus probe"
            git pull --rebase origin county-recovery-v2
            git push origin HEAD:county-recovery-v2
          fi
