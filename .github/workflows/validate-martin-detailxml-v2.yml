name: Validate Martin Detail XML v2
on:
  push:
    branches: [promote-martin-detailxml-v2]
    paths:
      - 'data/martin.json'
      - 'scripts/validate_prepare_martin_detailxml_v2.py'
      - '.github/workflows/validate-martin-detailxml-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_prepare_martin_detailxml_v2.py
      - name: Persist validated Martin snapshot
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/martin.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate and prepare Martin official Detail XML results'
          git push origin HEAD:promote-martin-detailxml-v2
# retrigger
