name: Probe County Fallbacks v2

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/election-ingestion-v2
    paths:
      - 'scripts/probe_county_fallbacks_v2.py'
      - '.github/workflows/probe-county-fallbacks-v2.yml'

permissions:
  contents: write

jobs:
  probe-fallbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe official fallback pages
        run: |
          python scripts/probe_county_fallbacks_v2.py \
            --manifest data/manifest.json \
            --output build/county-fallback-probe-v2.json
      - name: Validate probe coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/county-fallback-probe-v2.json').read_text())
          assert data.get('status')=='complete',data
          assert data.get('fallbackCount')==16,data
          assert len(data.get('counties') or [])==16,data
          print(f"PASS: probed all {data['fallbackCount']} official fallback counties; {data['reachableCount']} reachable")
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: county-fallback-probe-v2
          path: build/county-fallback-probe-v2.json
          retention-days: 7
      - name: Persist diagnostic snapshot
        run: |
          mkdir -p validation-output
          cp build/county-fallback-probe-v2.json validation-output/county-fallback-probe-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation-output/county-fallback-probe-v2.json
          if git diff --cached --quiet; then
            echo 'Fallback probe unchanged'
            exit 0
          fi
          git commit -m 'Store county fallback v2 probe [skip ci]'
          git push origin HEAD:rebuild/election-ingestion-v2
