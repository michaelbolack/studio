name: Polling Source Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check polling sources without publishing
        run: python scripts/monitor_polling_sources.py --output polling-source-monitor-report.json
      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: polling-source-monitor-report
          path: polling-source-monitor-report.json
          retention-days: 14
