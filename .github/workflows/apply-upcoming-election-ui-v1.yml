name: Apply upcoming election UI v1
on:
  push:
    branches: [upcoming-election-ui-v1]
    paths:
      - 'scripts/apply_upcoming_election_ui_v1.py'
      - '.github/workflows/apply-upcoming-election-ui-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_upcoming_election_ui_v1.py
      - name: Validate upcoming election UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text()
          c=json.load(open('data/election-config.json'))
          assert 'UPCOMING ELECTION' in s
          assert 'next-election-count' in s
          assert c['nextElection']['electionDate']=='2026-11-03'
          assert c['nextElection']['registrationDeadline']=='2026-10-05'
          PY
      - name: Persist generated frontend
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html data/election-config.json
          git commit -m 'Add upcoming election calendar card'
          git push origin HEAD:upcoming-election-ui-v1
