name: Official Headline Election Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_official_headline_results.py'
      - '.github/workflows/official-headline-results.yml'
  schedule:
    - cron: '*/5 * 4-17 11 *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-headline-results
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Pull direct Florida Election Watch headline totals
        run: python scripts/update_official_headline_results.py
      - name: Publish direct official totals
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/official-headline-results
          cp data/official-headline-results.json data/statewide.json data/district-9.json /tmp/official-headline-results/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/official-headline-results/official-headline-results.json data/
          cp /tmp/official-headline-results/statewide.json data/
          cp /tmp/official-headline-results/district-9.json data/
          python scripts/collect_general_watch.py || echo "General Watch source refresh completed with retained fallback for any unavailable source"
          git add data/official-headline-results.json data/statewide.json data/district-9.json data/general-watch.json data/general-watch-state.json data/general-watch-county.json data/general-watch-health.json
          if git diff --cached --quiet; then
            echo "No headline result changes."
          else
            git commit -m "Refresh direct official headline election totals"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Official headline push failed after 5 attempts; deploying generated site directly instead."
                break
              fi
              sleep 5
            done
          fi

      - name: Package static site with direct official results
        run: |
          mkdir -p /tmp/official-results-site
          cp index.html newsroom.html results.json /tmp/official-results-site/
          cp -a assets data /tmp/official-results-site/
          touch /tmp/official-results-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/official-results-site
      - name: Deploy direct official results to GitHub Pages
        uses: actions/deploy-pages@v4
