name: Official Headline Election Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_official_headline_results.py'
      - '.github/workflows/official-headline-results.yml'
  schedule:
    - cron: '*/5 * 4-17 11 *'

permissions:
  contents: write

concurrency:
  group: official-headline-results
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Pull direct Florida Election Watch headline totals
        run: python scripts/update_official_headline_results.py
      - name: Publish direct official totals
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official-headline-results.json data/statewide.json data/district-9.json
          if git diff --cached --quiet; then
            echo "No headline result changes."
          else
            git commit -m "Refresh direct official headline election totals"
            git push origin HEAD:main
          fi
