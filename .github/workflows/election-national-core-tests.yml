name: Election National Core Tests

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/election-national-foundation
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests beautifulsoup4

      - name: Run national election safety tests
        run: python -m pytest -q tests/test_election_core.py tests/test_jurisdiction_registry.py tests/test_election_paths.py tests/test_local_jurisdictions.py tests/test_florida_local_index.py tests/test_district_coverage.py tests/test_state_adapter_contract.py tests/test_florida_adapter.py
