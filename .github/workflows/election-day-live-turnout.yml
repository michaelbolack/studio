name: Election Day Live Turnout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_election_day_turnout.py'
      - '.github/workflows/election-day-live-turnout.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: election-day-live-turnout
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Election Day window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          active = (
              (now.date().isoformat() == "2026-11-03" and 6 <= now.hour <= 23)
              or (now.date().isoformat() == "2026-11-04" and now.hour <= 2)
          )
          value = "true" if active else "false"
          print(f"active={value} at {now.isoformat()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"active={value}\n")
          PY
      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: pip install requests beautifulsoup4
      - name: Check official turnout every minute
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Turnout check $attempt/5"
            git pull --rebase origin main || true

            if python scripts/update_election_day_turnout.py; then
              git add data/election-day-turnout.json
              if ! git diff --cached --quiet; then
                git commit -m "Refresh Election Day turnout"
                git push origin HEAD:main
              else
                echo "No turnout changes."
              fi
            else
              echo "Official turnout source not ready on this check; keeping last verified snapshot."
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 60
            fi
          done
