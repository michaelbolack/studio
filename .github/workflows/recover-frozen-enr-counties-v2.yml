name: Recover frozen ENR counties v2
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/recover_frozen_enr_counties_v2.py'
      - '.github/workflows/recover-frozen-enr-counties-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen county files against DOS
        run: python scripts/recover_frozen_enr_counties_v2.py
      - name: Commit only validated manifest/report
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manifest.json frozen-enr-recovery-report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Recover validated frozen ENR counties"
            git push origin HEAD:county-recovery-v2
          fi
