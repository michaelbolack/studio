name: Probe HTML County Totals v2
on:
  workflow_dispatch:
  push:
    branches: [rebuild/election-ingestion-v2]
    paths:
      - 'scripts/probe_html_county_totals_v2.py'
      - '.github/workflows/probe-html-county-totals-v2.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/probe_html_county_totals_v2.py
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation-output/html-county-total-probe-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store DOS fingerprint HTML county-total probe [skip ci]'
          git push origin HEAD:rebuild/election-ingestion-v2
