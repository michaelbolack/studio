name: Fast official Florida statewide results

# TEMPORARILY MANUAL ONLY while the Florida DOS adapter is validated.
# Keeping this off the schedule prevents it from racing the primary election
# updater for data/statewide.json, data/district-9.json and data/manifest.json.
on:
  workflow_dispatch:

concurrency:
  group: election-results-publisher-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Pull Florida DOS statewide and District 9 totals
        continue-on-error: true
        run: python scripts/official_state_results.py
      - name: Publish statewide result files if changed
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/statewide.json data/district-9.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No statewide result changes"
          else
            git commit -m "Update official Florida statewide results"
            git pull --rebase origin main
            git push
          fi
