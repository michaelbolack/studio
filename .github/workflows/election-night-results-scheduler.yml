name: Election Night Results Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/election-night-results-scheduler.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: election-night-results-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check Florida election-night window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          active = (
              (now.date().isoformat() == "2026-11-03" and now.hour >= 19)
              or (now.date().isoformat() == "2026-11-04" and now.hour <= 2)
          )
          value = "true" if active else "false"
          print(f"active={value} at {now.isoformat()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"active={value}\n")
          PY
      - name: Trigger live election results publisher
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-election-publish.yml --ref main

# forced 7pm election-night check
