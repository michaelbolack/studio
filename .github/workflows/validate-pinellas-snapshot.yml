name: Validate Pinellas browser snapshot
on:
  push:
    branches: [recover-pinellas-json]
    paths:
      - 'data/pinellas.json'
      - 'scripts/validate_pinellas_snapshot.py'
      - '.github/workflows/validate-pinellas-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_pinellas_snapshot.py
      - name: Persist validated snapshot
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/pinellas.json data/manifest.json data/pinellas-validation.json
          git commit -m 'Validate Pinellas browser JSON snapshot' || exit 0
          git push origin HEAD:recover-pinellas-json
