name: District 9 General Election Fast Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_district9_live.py'
      - '.github/workflows/district9-live-results.yml'
      - 'data/glades.json'
      - 'data/highlands.json'
      - 'data/indian-river.json'
      - 'data/okeechobee.json'
      - 'data/orange.json'
      - 'data/osceola.json'
      - 'data/polk.json'

permissions:
  contents: write

concurrency:
  group: district9-live-results
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current District 9 General Election aggregate
        run: python scripts/update_district9_live.py
      - name: Publish District 9 aggregate
        run: |
          git config user.name "irc-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/district-9.json
          if git diff --cached --quiet; then
            echo "No District 9 changes."
          else
            git commit -m "Refresh District 9 General Election results"
            git push origin HEAD:main
          fi
