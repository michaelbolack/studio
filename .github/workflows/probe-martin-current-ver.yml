name: Probe Martin Clarity current_ver
on:
  push:
    branches: [county-recovery-v2]
    paths:
      - 'scripts/probe_martin_current_ver.py'
      - '.github/workflows/probe-martin-current-ver.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/probe_martin_current_ver.py
      - name: Persist probe
        run: |
          git config user.name 'irc-election-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add martin-current-ver-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist Martin current_ver probe'
          git pull --rebase origin county-recovery-v2
          git push origin HEAD:county-recovery-v2
